# Copy this file to configs/model.local.yaml and fill api_key.
# configs/model.local.yaml is ignored by git.

base_url: https://api.deepseek.com
api_key: EMPTY
model: your-deepseek-model
auto_model: false
temperature: 0.1
max_tokens: 4500
context_window_tokens: 32768
max_input_tokens: 27000
timeout_sec: 300
retry_on_timeout: 1
analysis_report_max_tokens: 7000
analysis_report_context_chars: 56000
analysis_report_revisions: 2

# Some reasoning models separate thinking from final content. Disable thinking
# when the compatible endpoint otherwise returns an empty message content.
thinking: disabled

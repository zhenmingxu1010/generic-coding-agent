# Copy to configs/model.local.yaml and fill in values for your provider.
# The local file is ignored by Git.

base_url: https://your-openai-compatible-provider.example/v1
api_key: EMPTY
model: your-model-name
auto_model: false
temperature: 0.1
max_tokens: 4500
context_window_tokens: 32768
max_input_tokens: 27000
timeout_sec: 300
retry_on_timeout: 1
analysis_report_max_tokens: 4500
analysis_report_context_chars: 56000
analysis_report_revisions: 1

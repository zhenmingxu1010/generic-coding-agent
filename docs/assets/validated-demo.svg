<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Generic Coding Agent validation summary</title>
  <desc id="description">Terminal-style summary showing eleven of eleven model-backed scenarios, 536 offline tests, package build, and isolated wheel smoke checks passing.</desc>
  <rect width="1280" height="720" rx="18" fill="#0d1117"/>
  <rect width="1280" height="58" rx="18" fill="#161b22"/>
  <rect y="40" width="1280" height="18" fill="#161b22"/>
  <circle cx="34" cy="29" r="8" fill="#ff5f56"/>
  <circle cx="60" cy="29" r="8" fill="#ffbd2e"/>
  <circle cx="86" cy="29" r="8" fill="#27c93f"/>
  <text x="640" y="36" fill="#8b949e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">generic-coding-agent — release validation</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">
    <text x="42" y="98" fill="#8b949e">$ python scripts/collect_regression_audits.py --strict</text>
    <text x="42" y="135" fill="#3fb950">PASS</text><text x="112" y="135" fill="#c9d1d9">T01–T04  analysis, generation, CLI behavior, interface repair</text>
    <text x="42" y="169" fill="#3fb950">PASS</text><text x="112" y="169" fill="#c9d1d9">T05–T08  negative verification, isolation, repair, greenfield CLI</text>
    <text x="42" y="203" fill="#3fb950">PASS</text><text x="112" y="203" fill="#c9d1d9">T09–T11  short prompt, clarification, colloquial inspection</text>
    <text x="42" y="241" fill="#58a6ff">RESULT</text><text x="130" y="241" fill="#f0f6fc">11/11 detailed validators passed</text>

    <text x="42" y="302" fill="#8b949e">$ python scripts/release_check.py</text>
    <text x="42" y="339" fill="#3fb950">PASS</text><text x="112" y="339" fill="#c9d1d9">source scan        0 credential/private-path hits</text>
    <text x="42" y="373" fill="#3fb950">PASS</text><text x="112" y="373" fill="#c9d1d9">compile            coding_agent + evaluations + tests</text>
    <text x="42" y="407" fill="#3fb950">PASS</text><text x="112" y="407" fill="#f0f6fc">pytest             536 passed</text>
    <text x="42" y="441" fill="#3fb950">PASS</text><text x="112" y="441" fill="#c9d1d9">build              wheel + source distribution</text>
    <text x="42" y="475" fill="#3fb950">PASS</text><text x="112" y="475" fill="#c9d1d9">wheel smoke        isolated import + 3 console entry points</text>
    <text x="42" y="513" fill="#58a6ff">RESULT</text><text x="130" y="513" fill="#f0f6fc">local v0.1.0-alpha release gate passed</text>

    <text x="42" y="574" fill="#8b949e">$ python -m evaluations.real_world.collect_results ...</text>
    <text x="42" y="611" fill="#3fb950">PASS</text><text x="112" y="611" fill="#c9d1d9">external acceptance 4/4 · protected mutations 0</text>
    <text x="42" y="645" fill="#3fb950">PASS</text><text x="112" y="645" fill="#c9d1d9">success-claim precision 100% · false-positive claims 0</text>
  </g>
  <text x="42" y="691" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">Alpha evidence, not a claim of broad benchmark or production performance.</text>
</svg>
